<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#091321">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wolf Haven">
<title>Wolf Haven · CoveScapes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css">
<script defer src="defaults.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<main id="main">
<section id="home">
<header class="hero">
<p class="brand"><span aria-hidden="true">✦</span> CoveScapes</p>
<h1>Wolf Haven</h1>
<p class="edition">Open Theory Cove</p>
<div class="timebox"><time id="clock"></time><time id="date"></time></div>
</header>
<div class="home-content">
<form id="search" action="https://www.google.com/search" target="_blank" rel="noopener noreferrer">
<span data-icon="search"></span><input type="search" name="q" aria-label="Search Google" placeholder="Search Google" required>
<button type="submit">Search</button>
</form>
<section aria-labelledby="quick-title">
<div class="section-title"><h2 id="quick-title">Quick launch</h2><button id="edit-quick" class="quiet">Edit</button></div>
<div id="quick" class="quick"></div>
</section>
<section aria-labelledby="category-title">
<div class="section-title"><h2 id="category-title">Categories</h2><button id="manage" class="quiet">Manage</button></div>
<div id="categories" class="categories"></div>
</section>
</div>
</section>
<section id="secondary" class="secondary" hidden></section>
</main>
<nav class="dock" aria-label="Main navigation">
<button data-view="home" aria-current="page"><span data-icon="home"></span>Home</button>
<button data-view="notes"><span data-icon="notes"></span>Notes</button>
<button data-view="favorites"><span data-icon="star"></span>Favorites</button>
<button data-view="settings"><span data-icon="settings"></span>Settings</button>
</nav>
<dialog id="dialog" aria-labelledby="dialog-title">
<header><h2 id="dialog-title"></h2><button id="close" class="icon-button" aria-label="Close"><span data-icon="close"></span></button></header>
<div id="dialog-content"></div>
</dialog>
<div id="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
